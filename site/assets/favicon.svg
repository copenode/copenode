<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- copenode favicon — echoes the copernican logo mark -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#101216"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <g fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2">
    <circle cx="32" cy="32" r="17"/>
    <circle cx="32" cy="32" r="25" stroke-opacity="0.45"/>
  </g>
  <!-- sun -->
  <circle cx="32" cy="32" r="6" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="22" x2="32" y2="25"/>
    <line x1="32" y1="42" x2="32" y2="39"/>
    <line x1="22" y1="32" x2="25" y2="32"/>
    <line x1="42" y1="32" x2="39" y2="32"/>
    <line x1="25.1" y1="25.1" x2="27.2" y2="27.2"/>
    <line x1="38.9" y1="38.9" x2="36.8" y2="36.8"/>
    <line x1="38.9" y1="25.1" x2="36.8" y2="27.2"/>
    <line x1="25.1" y1="38.9" x2="27.2" y2="36.8"/>
  </g>
  <!-- planets -->
  <circle cx="32" cy="15" r="2.4" fill="#f0f2f5"/>
  <circle cx="48.3" cy="40" r="2" fill="#38bdf8"/>
</svg>
